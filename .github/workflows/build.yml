name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DiskAnalyzer.sln -c Release

      - name: Test
        run: dotnet test DiskAnalyzer.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  release:
    # Tag a commit with v* (e.g. v1.0.1) to build the self-contained exe and MSI and attach them to a draft release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build, test, publish and package
        shell: pwsh
        run: ./build.ps1
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/DiskAnalyzer-portable-x64.zip
      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.msi, artifacts/*.zip | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" artifacts/*.msi artifacts/*.zip artifacts/SHA256SUMS.txt --draft --generate-notes --title "Disk Analyzer ${{ github.ref_name }}"
